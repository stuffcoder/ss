<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Screenshare - Channels</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; color: #e0e0e0;
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }
        .container { width: 100%; max-width: 1400px; display: flex; flex-direction: column; flex: 1; }
        h1 { color: #ffffff; text-align: center; margin: 0 0 15px 0; font-size: 1.5rem; }
        
        .app-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            flex: 1;
            align-items: start;
        }
        @media (max-width: 900px) {
            .app-layout { grid-template-columns: 1fr; }
        }

        .sidebar {
            display: flex; flex-direction: column; gap: 15px;
        }

        .main-content {
            display: flex; flex-direction: column; height: 100%;
        }

        .card {
            background-color: #1e1e1e; border: 1px solid #2d2d2d;
            border-radius: 8px; padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: #bb86fc; font-size: 1.1rem; margin-bottom: 10px; }
        p { color: #a0a0a0; font-size: 0.9rem; line-height: 1.4; margin: 0 0 10px 0; }
        
        .channel-list {
            display: flex; flex-direction: column; gap: 10px;
        }
        .channel-item {
            background-color: #2a2a2a; border: 1px solid #3d3d3d;
            border-radius: 6px; padding: 12px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .channel-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .channel-header h3 { margin: 0; color: #03dac6; font-size: 1rem; }
        .channel-status { font-size: 0.8rem; color: #888; font-family: monospace; }
        
        .button-group { display: flex; gap: 8px; }
        
        button {
            background-color: #bb86fc; color: #121212; border: none;
            padding: 6px 12px; font-weight: bold; border-radius: 4px;
            cursor: pointer; transition: background-color 0.2s; flex: 1;
            font-size: 0.9rem;
        }
        button:hover { background-color: #9965db; }
        button.join-btn { background-color: #03dac6; }
        button.join-btn:hover { background-color: #018786; }
        button.danger-btn { background-color: #cf6679; color: #fff; }
        button.danger-btn:hover { background-color: #b05263; }
        button:disabled { background-color: #444; color: #777; cursor: not-allowed; }
        
        .video-container {
            position: relative; width: 100%; background: #000;
            border-radius: 8px; overflow: hidden; border: 1px solid #2d2d2d;
            flex: 1; display: flex; align-items: center; justify-content: center;
            min-height: 520px;
        }
        video { width: 100%; height: 100%; object-fit: contain; display: block; cursor: crosshair; }
        
        .placeholder-text {
            position: absolute; color: #666; font-size: 1.1rem; text-align: center; padding: 20px;
        }

        .click-pointer {
            position: absolute; width: 20px; height: 20px;
            background-color: rgba(255, 0, 0, 0.7);
            border: 2px solid white; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            animation: fadeOut 1.5s forwards; z-index: 100;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }

        .setting-group { margin-bottom: 10px; }
        .setting-group:last-child { margin-bottom: 0; }
        input[type="range"], select {
            width: 100%; padding: 8px; background-color: #2d2d2d;
            border: 1px solid #444; border-radius: 4px; color: #fff;
            box-sizing: border-box; margin-top: 4px; font-size: 0.9rem;
        }
        input[type="range"] { cursor: pointer; }
        
        .stream-info-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 10px; padding: 8px 12px; background-color: #1e1e1e;
            border-radius: 6px; border: 1px solid #2d2d2d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌐 Interactive Screenshare</h1>

    <div class="app-layout">
        <!-- Sidebar: Channels & Settings (Small part) -->
        <div class="sidebar">
            <div class="card">
                <h2>Channels</h2>
                <div class="channel-list">
                    <!-- Channel 1 -->
                    <div class="channel-item">
                        <div class="channel-header">
                            <h3>Channel 1</h3>
                            <div class="channel-status" id="status-1">Idle</div>
                        </div>
                        <div class="button-group">
                            <button onclick="hostChannel(1)" id="host-btn-1">Host</button>
                            <button class="join-btn" onclick="joinChannel(1)" id="join-btn-1">Join</button>
                        </div>
                    </div>

                    <!-- Channel 2 -->
                    <div class="channel-item">
                        <div class="channel-header">
                            <h3>Channel 2</h3>
                            <div class="channel-status" id="status-2">Idle</div>
                        </div>
                        <div class="button-group">
                            <button onclick="hostChannel(2)" id="host-btn-2">Host</button>
                            <button class="join-btn" onclick="joinChannel(2)" id="join-btn-2">Join</button>
                        </div>
                    </div>

                    <!-- Channel 3 -->
                    <div class="channel-item">
                        <div class="channel-header">
                            <h3>Channel 3</h3>
                            <div class="channel-status" id="status-3">Idle</div>
                        </div>
                        <div class="button-group">
                            <button onclick="hostChannel(3)" id="host-btn-3">Host</button>
                            <button class="join-btn" onclick="joinChannel(3)" id="join-btn-3">Join</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Stream Settings</h2>
                <div class="setting-group">
                    <label for="qualitySelect" style="font-size: 0.85rem; color: #a0a0a0;">Resolution:</label>
                    <select id="qualitySelect">
                        <option value="720" selected>720p (60fps Smooth)</option>
                        <option value="1080">1080p (High Quality)</option>
                    </select>
                </div>
                <div class="setting-group" style="margin-top: 10px;">
                    <label for="bwSlider" style="font-size: 0.85rem; color: #a0a0a0;">Max Bandwidth: <span id="bwLabel">4000</span> Kbps</label>
                    <input type="range" id="bwSlider" min="500" max="10000" step="500" value="4000">
                </div>
            </div>
        </div>

        <!-- Main Content: Stream Window (Majority of the page) -->
        <div class="main-content">
            <div class="card" style="display: flex; flex-direction: column; flex: 1; margin-bottom: 0;">
                <h2 id="viewTitle">Stream Window</h2>
                <div id="pointerOverlay" class="video-container">
                    <div class="placeholder-text" id="placeholderText">Select a channel to Host or Join to start streaming</div>
                    <video id="sharedVideo" autoplay playsinline controls></video>
                </div>
                <div class="stream-info-bar">
                    <span id="activeInfo" style="font-family: monospace; color: #03dac6; font-size: 0.9rem;">Not Connected</span>
                    <button class="danger-btn" onclick="leaveChannel()" id="disconnectBtn" style="display: none; flex: 0 0 auto; width: auto; padding: 6px 14px;">Disconnect</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let peer = null;
    let localStream = null;
    let activeCall = null;
    let activeConnection = null;
    let currentRole = null;

    const qualitySelect = document.getElementById('qualitySelect');
    const bwSlider = document.getElementById('bwSlider');
    const bwLabel = document.getElementById('bwLabel');
    
    const viewTitle = document.getElementById('viewTitle');
    const sharedVideo = document.getElementById('sharedVideo');
    const placeholderText = document.getElementById('placeholderText');
    const pointerOverlay = document.getElementById('pointerOverlay');
    const activeInfo = document.getElementById('activeInfo');
    const disconnectBtn = document.getElementById('disconnectBtn');

    bwSlider.addEventListener('input', () => {
        const kbps = parseInt(bwSlider.value);
        bwLabel.innerText = kbps;
        if (activeCall && activeCall.peerConnection) {
            const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) {
                const params = sender.getParameters();
                if (!params.encodings) params.encodings = [{}];
                params.encodings[0].maxBitrate = kbps * 1000;
                sender.setParameters(params).catch(console.error);
            }
        }
    });

    sharedVideo.addEventListener('pause', () => {
        if (currentRole === 'viewer') sharedVideo.play();
    });

    function resetUI() {
        if (peer) {
            peer.destroy();
            peer = null;
        }
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        activeCall = null;
        activeConnection = null;
        currentRole = null;

        sharedVideo.srcObject = null;
        placeholderText.style.display = 'block';
        disconnectBtn.style.display = 'none';
        activeInfo.innerText = "Not Connected";
        viewTitle.innerText = "Stream Window";

        for (let i = 1; i <= 3; i++) {
            document.getElementById(`host-btn-${i}`).disabled = false;
            document.getElementById(`join-btn-${i}`).disabled = false;
            document.getElementById(`status-${i}`).innerText = "Idle";
        }
    }

    function leaveChannel() {
        resetUI();
    }

    async function hostChannel(chNum) {
        resetUI();
        currentRole = 'host';

        const hostBtn = document.getElementById(`host-btn-${chNum}`);
        const joinBtn = document.getElementById(`join-btn-${chNum}`);
        const statusEl = document.getElementById(`status-${chNum}`);

        hostBtn.disabled = true;
        joinBtn.disabled = true;
        statusEl.innerText = "Requesting...";

        try {
            const is720p = qualitySelect.value === "720";
            const constraints = is720p ? {
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } },
                audio: { echoCancellation: false, noiseSuppression: false }
            } : {
                video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } },
                audio: { echoCancellation: false, noiseSuppression: false }
            };

            localStream = await navigator.mediaDevices.getDisplayMedia(constraints);
        } catch (err) {
            console.error("Screen capture error:", err);
            statusEl.innerText = "Cancelled";
            hostBtn.disabled = false;
            joinBtn.disabled = false;
            return;
        }

        localStream.getVideoTracks()[0].onended = () => {
            leaveChannel();
        };

        statusEl.innerText = "Connecting...";
        const peerId = `interactive-screenshare-chan-${chNum}`;
        peer = new Peer(peerId);

        peer.on('open', () => {
            statusEl.innerText = "Hosting Live";
            viewTitle.innerText = `Hosting Channel ${chNum} (Preview)`;
            sharedVideo.srcObject = localStream;
            sharedVideo.muted = true;
            placeholderText.style.display = 'none';
            disconnectBtn.style.display = 'block';
            activeInfo.innerText = `Channel ${chNum} Active - Waiting for friend to join...`;
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                alert(`Channel ${chNum} is already in use by someone else!`);
            } else {
                console.error("Peer error:", err);
            }
            leaveChannel();
        });

        peer.on('connection', (conn) => {
            activeConnection = conn;
            conn.on('open', () => {
                activeInfo.innerText = `Channel ${chNum} Connected with Friend!`;
                if (localStream) {
                    activeCall = peer.call(conn.peer, localStream);
                    setTimeout(() => {
                        const kbps = parseInt(bwSlider.value);
                        if (activeCall && activeCall.peerConnection) {
                            const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                            if (sender) {
                                const params = sender.getParameters();
                                if (!params.encodings) params.encodings = [{}];
                                params.encodings[0].maxBitrate = kbps * 1000;
                                sender.setParameters(params).catch(console.error);
                            }
                        }
                    }, 500);
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'click') {
                    const dot = document.createElement('div');
                    dot.className = 'click-pointer';
                    dot.style.left = `${data.x * 100}%`;
                    dot.style.top = `${data.y * 100}%`;
                    pointerOverlay.appendChild(dot);
                    setTimeout(() => dot.remove(), 1500);
                }
            });

            conn.on('close', () => {
                activeInfo.innerText = `Channel ${chNum} Active - Friend disconnected.`;
            });
        });
    }

    function joinChannel(chNum) {
        resetUI();
        currentRole = 'viewer';

        const hostBtn = document.getElementById(`host-btn-${chNum}`);
        const joinBtn = document.getElementById(`join-btn-${chNum}`);
        const statusEl = document.getElementById(`status-${chNum}`);

        hostBtn.disabled = true;
        joinBtn.disabled = true;
        statusEl.innerText = "Connecting...";

        peer = new Peer();

        peer.on('open', () => {
            const hostPeerId = `interactive-screenshare-chan-${chNum}`;
            const conn = peer.connect(hostPeerId);
            activeConnection = conn;

            conn.on('open', () => {
                statusEl.innerText = "Connected!";
                viewTitle.innerText = `Watching Channel ${chNum} (Click to point)`;
                placeholderText.style.display = 'none';
                disconnectBtn.style.display = 'block';
                activeInfo.innerText = `Connected to Channel ${chNum}. Click anywhere to point for your friend.`;
                sharedVideo.muted = false;
            });

            conn.on('error', () => {
                statusEl.innerText = "Failed";
                alert(`Could not connect to Channel ${chNum}. Make sure your friend is hosting it first.`);
                leaveChannel();
            });
        });

        peer.on('call', (call) => {
            activeCall = call;
            call.answer();
            call.on('stream', (incomingStream) => {
                sharedVideo.srcObject = incomingStream;
            });
            call.on('close', () => {
                alert("Stream ended by host.");
                leaveChannel();
            });
        });

        peer.on('error', (err) => {
            console.error("Peer error:", err);
            statusEl.innerText = "Error";
            alert("Connection error occurred.");
            leaveChannel();
        });

        sharedVideo.onclick = (e) => {
            if (!activeConnection || activeConnection.open !== true) return;
            const rect = sharedVideo.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            activeConnection.send({ type: 'click', x: x, y: y });
        };
    }
</script>

</body>
</html>
